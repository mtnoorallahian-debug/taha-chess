
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taha Chess ♟️</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10151f;color:#f4f6fa;
 font-family:Tahoma,Arial,sans-serif;text-align:center;
 padding:20px 12px 35px
}
h1{margin:4px 0;color:#d9edbd;font-size:30px}
.subtitle{color:#aab5c6;font-size:13px;margin:8px 0 20px}
.app{max-width:480px;margin:auto}
.top{
 display:flex;justify-content:space-between;align-items:center;
 gap:8px;background:#1b2432;padding:12px;
 border-radius:14px;margin-bottom:12px
}
#status{font-size:13px;color:#e3eaf5;text-align:right}
.tag{font-size:11px;color:#c4e88d;white-space:nowrap}
.board{
 width:100%;aspect-ratio:1;display:grid;
 grid-template-columns:repeat(8,1fr);
 border:5px solid #263243;border-radius:7px;overflow:hidden;
 box-shadow:0 12px 35px #0005;direction:ltr
}
.square{
 border:0;padding:0;margin:0;position:relative;
 display:flex;align-items:center;justify-content:center;
 aspect-ratio:1;cursor:pointer;touch-action:manipulation;
 font-family:"Arial Unicode MS",serif;font-size:clamp(26px,8vw,45px);
 user-select:none
}
.light{background:#e6e1d3}
.dark{background:#718b79}
.square.selected{background:#e8d36d!important}
.square.last{background:#baca65}
.square.hint:after{
 content:"";width:25%;height:25%;border-radius:50%;
 background:#263a34a8;position:absolute
}
.square.capture:after{
 content:"";position:absolute;inset:3px;border:4px solid #a43b48;
 border-radius:50%;background:transparent
}
.piece.white{color:#fff;text-shadow:1px 2px 2px #222,0 0 2px #222}
.piece.black{color:#20242c;text-shadow:0 1px 1px #fff6}
.controls{
 display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px
}
button.action,select{
 background:#263346;color:#f5f7fb;border:1px solid #3c4b60;
 padding:12px 8px;border-radius:11px;font-size:13px;
 cursor:pointer
}
button.action:active{transform:scale(.98)}
select{width:100%;margin-top:10px}
.history{
 margin-top:14px;background:#1b2432;border-radius:13px;
 padding:12px;text-align:right;min-height:55px
}
.history h3{margin:0 0 8px;font-size:13px;color:#d9edbd}
#moves{font-size:12px;color:#c1ccda;line-height:2;overflow-wrap:anywhere}
footer{color:#718096;font-size:11px;margin-top:18px}
@media(min-width:500px){.square{font-size:44px}}
</style>
</head>
<body>
<div class="app">
<h1>♟ TAHA CHESS</h1>
<div class="subtitle">شطرنج بازی کن، فکر کن، برنده شو.</div>

<div class="top">
 <div id="status">در حال آماده‌سازی بازی...</div>
 <div class="tag">♛ CHESS ARENA</div>
</div>

<div class="board" id="board"></div>

<div class="controls">
 <button class="action" onclick="undoMove()">↩️ برگشت حرکت</button>
 <button class="action" onclick="newGame()">🔄 بازی جدید</button>
</div>

<select id="mode" onchange="newGame()">
 <option value="ai">🤖 بازی با کامپیوتر</option>
 <option value="two">👥 بازی دونفره</option>
</select>

<div class="history">
 <h3>📜 تاریخچهٔ حرکات</h3>
 <div id="moves">هنوز حرکتی انجام نشده.</div>
</div>
<footer>TAHA CHESS · حالا نوبت توئه!</footer>
</div>

<script>
const game = new Chess();
const board = document.getElementById('board');
const statusBox = document.getElementById('status');
const movesBox = document.getElementById('moves');

const icons = {
 wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',
 bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'
};

let selected = null;
let legalTargets = [];
let lastMove = null;
let thinking = false;

function render(){
 board.innerHTML='';
 const position=game.board();

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const sq=String.fromCharCode(97+c)+(8-r);
   const cell=document.createElement('button');
   cell.className='square '+((r+c)%2===0?'light':'dark');
   cell.setAttribute('aria-label',sq);

   if(lastMove && (sq===lastMove.from||sq===lastMove.to))
    cell.classList.add('last');

   if(sq===selected) cell.classList.add('selected');

   const piece=position[r][c];
   if(piece){
    const span=document.createElement('span');
    span.className='piece '+(piece.color==='w'?'white':'black');
    span.textContent=icons[piece.color+piece.type];
    cell.appendChild(span);
   }

   const target=legalTargets.find(m=>m.to===sq);
   if(target){
    cell.classList.add(piece?'capture':'hint');
   }

   cell.onclick=()=>tapSquare(sq);
   board.appendChild(cell);
  }
 }

 updateStatus();
 updateHistory();
}

function updateStatus(){
 if(game.isCheckmate()){
  statusBox.textContent='مات! '+(game.turn()==='w'?'سیاه':'سفید')+' برنده شد 🏆';
 }else if(game.isDraw()){
  statusBox.textContent='بازی مساوی شد 🤝';
 }else if(game.isCheck()){
  statusBox.textContent='کیش! نوبت '+(game.turn()==='w'?'سفید':'سیاه');
 }else{
  statusBox.textContent='نوبت '+(game.turn()==='w'?'سفید ⚪':'سیاه ⚫');
  if(thinking) statusBox.textContent='کامپیوتر در حال فکر کردن است...';
 }
}

function updateHistory(){
 const list=game.history();
 if(!list.length){
  movesBox.textContent='هنوز حرکتی انجام نشده.';
  return;
 }
 let lines=[];
 for(let i=0;i<list.length;i+=2){
  lines.push((Math.floor(i/2)+1)+'. '+list[i]+(list[i+1]?'  '+list[i+1]:''));
 }
 movesBox.textContent=lines.join('   |   ');
}

function tapSquare(sq){
 if(thinking||game.isGameOver())return;
 if(document.getElementById('mode').value==='ai'&&game.turn()==='b')return;

 const piece=game.get(sq);
 if(selected){
  const move=legalTargets.find(m=>m.to===sq);
  if(move){
   let result=game.move({from:selected,to:sq,promotion:'q'});
   if(result){
    lastMove={from:result.from,to:result.to};
    selected=null;legalTargets=[];render();
    if(!game.isGameOver()&&document.getElementById('mode').value==='ai'){
     thinking=true;updateStatus();
     setTimeout(aiMove,350);
    }
    return;
   }
  }
 }

 if(piece&&piece.color===game.turn()){
  selected=sq;
  legalTargets=game.moves({square:sq,verbose:true});
 }else{
  selected=null;legalTargets=[];
 }
 render();
}

function aiMove(){
 if(game.isGameOver()){thinking=false;render();return}
 const moves=game.moves({verbose:true});
 if(!moves.length){thinking=false;render();return}

 // انتخاب حرکت با اولویت گرفتن مهره و ارتقای پیاده
 const values={p:10,n:30,b:32,r:50,q:90,k:900};
 function evaluate(m){
  let value=Math.random()*7;
  if(m.captured)value+=values[m.captured]*1.2;
  if(m.promotion)value+=80;
  if(m.san.includes('+'))value+=5;
  if(m.san.includes('#'))value+=10000;
  if(m.flags.includes('k')||m.flags.includes('q'))value+=2;
  return value;
 }
 moves.sort((a,b)=>evaluate(b)-evaluate(a));
 const move=moves[0];
 const result=game.move({from:move.from,to:move.to,promotion:'q'});
 if(result)lastMove={from:result.from,to:result.to};
 thinking=false;selected=null;legalTargets=[];render();
}

function undoMove(){
 if(thinking)return;
 if(!game.history().length)return;
 game.undo();
 if(document.getElementById('mode').value==='ai'&&game.turn()==='b'&&game.history().length){
  game.undo();
 }
 const hist=game.history({verbose:true});
 lastMove=hist.length?{from:hist[hist.length-1].from,to:hist[hist.length-1].to}:null;
 selected=null;legalTargets=[];render();
}

function newGame(){
 game.reset();selected=null;legalTargets=[];lastMove=null;thinking=false;
 render();
}

render();
</script>
</body>
</html>
